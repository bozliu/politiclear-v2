name: Daily Politiclear Refresh

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy refreshed data to the canonical Vercel app"
        required: false
        default: true
        type: boolean
      simulate_source_failure:
        description: "Force a recoverable /members source failure for degraded-path verification"
        required: false
        default: false
        type: boolean

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    outputs:
      fresh: ${{ steps.refresh-status.outputs.fresh }}
      should_deploy: ${{ steps.refresh-status.outputs.should_deploy }}
      status: ${{ steps.refresh-status.outputs.status }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Poppler tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Set up Conda dl environment
        uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: environment.dl.yml
          activate-environment: dl
          auto-activate: false
          channels: conda-forge
          conda-remove-defaults: true

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Smoke check Python ingest dependencies
        run: conda run -n dl python -c "import requests, lxml, PIL; print('python deps ok')"

      - name: Refresh and verify official data bundle
        env:
          POLITICLEAR_SIMULATE_SOURCE_FAILURE: ${{ inputs.simulate_source_failure == true && 'members' || '' }}
        run: npm run prepare:data

      - name: Read refresh status
        id: refresh-status
        run: |
          if [ ! -f data/generated/politiclear-refresh-status.json ]; then
            echo "Missing data/generated/politiclear-refresh-status.json" >&2
            exit 1
          fi
          node <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('node:fs')
          const status = JSON.parse(fs.readFileSync('data/generated/politiclear-refresh-status.json', 'utf8'))
          const validStatuses = new Set(['synced', 'degraded'])
          if (!validStatuses.has(status.status)) {
            throw new Error(`Unexpected refresh status: ${status.status}`)
          }
          for (const key of ['fresh', 'shouldDeploy']) {
            if (typeof status[key] !== 'boolean') {
              throw new Error(`Refresh status ${key} must be boolean`)
            }
          }
          console.log(`status=${status.status}`)
          console.log(`fresh=${status.fresh ? 'true' : 'false'}`)
          console.log(`should_deploy=${status.shouldDeploy ? 'true' : 'false'}`)
          NODE

      - name: Summarize refresh status
        run: |
          {
            echo "### Daily refresh status"
            node <<'NODE'
          const fs = require('node:fs')
          const status = JSON.parse(fs.readFileSync('data/generated/politiclear-refresh-status.json', 'utf8'))
          console.log(`- status: ${status.status}`)
          console.log(`- fresh: ${status.fresh}`)
          console.log(`- shouldDeploy: ${status.shouldDeploy}`)
          console.log(`- lastSuccessfulDataDate: ${status.lastSuccessfulDataDate ?? 'unknown'}`)
          if (status.errorSummary) {
            console.log(`- errorSummary: ${status.errorSummary}`)
          }
          NODE
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build web preview bundle
        run: npm run build:vercel

      - name: Upload refreshed artifacts
        uses: actions/upload-artifact@v7
        with:
          name: politiclear-refreshed-dist
          path: |
            data/generated
            dist

      - name: Open or update degraded issue
        if: steps.refresh-status.outputs.status == 'degraded'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Daily Politiclear Refresh degraded
        run: |
          issue_number="$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" | head -n 1 || true)"
          status_json="$(cat data/generated/politiclear-refresh-status.json)"
          body="$(cat <<EOF
          Daily Refresh degraded instead of failing red because an official source was temporarily unavailable.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Commit: ${GITHUB_SHA}
          Event: ${GITHUB_EVENT_NAME}

          \`\`\`json
          ${status_json}
          \`\`\`
          EOF
          )"
          if [ -n "${issue_number}" ]; then
            gh issue comment "${issue_number}" --body "${body}"
          else
            gh issue create --title "${ISSUE_TITLE}" --body "${body}"
          fi

      - name: Close degraded issue after fresh refresh
        if: steps.refresh-status.outputs.status == 'synced'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Daily Politiclear Refresh degraded
        run: |
          issue_number="$(gh issue list --state open --json number,title --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" | head -n 1 || true)"
          if [ -z "${issue_number}" ]; then
            exit 0
          fi
          body="Daily Refresh completed with fresh official data again.

          Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Commit: ${GITHUB_SHA}"
          gh issue close "${issue_number}" --comment "${body}"

  deploy-refresh:
    needs: refresh-data
    runs-on: ubuntu-latest
    if: >
      needs.refresh-data.outputs.fresh == 'true' &&
      needs.refresh-data.outputs.should_deploy == 'true' &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
      )
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Check Vercel deploy config
        id: vercel-config
        env:
          VERCEL_CANONICAL_URL: ${{ vars.VERCEL_CANONICAL_URL }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "${VERCEL_TOKEN:-}" ] && [ -n "${VERCEL_CANONICAL_URL:-}" ] && [ -n "${VERCEL_PROJECT_ID:-}" ] && [ -n "${VERCEL_ORG_ID:-}" ]; then
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Vercel deployment variables are incomplete, so the workflow refreshed data and build artifacts only."
          fi

      - name: Materialize Vercel project config and preflight access
        if: steps.vercel-config.outputs.should_deploy == 'true'
        env:
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_SLUG: ${{ vars.VERCEL_PROJECT_SLUG }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node scripts/materialize_vercel_project.mjs

      - name: Download refreshed artifacts
        if: steps.vercel-config.outputs.should_deploy == 'true'
        uses: actions/download-artifact@v8
        with:
          name: politiclear-refreshed-dist
          path: refreshed-artifacts

      - name: Restore refreshed artifacts into workspace
        if: steps.vercel-config.outputs.should_deploy == 'true'
        run: rsync -a refreshed-artifacts/ ./

      - name: Install dependencies
        if: steps.vercel-config.outputs.should_deploy == 'true'
        run: npm ci

      - name: Install Playwright browser
        if: steps.vercel-config.outputs.should_deploy == 'true'
        run: npx playwright install --with-deps chromium

      - name: Deploy refreshed canonical release when config is present
        if: steps.vercel-config.outputs.should_deploy == 'true'
        env:
          POLITICLEAR_EXPECT_CANONICAL_STAGE: live
          POLITICLEAR_EXPECT_DEPLOY_STAGE: live
          PREVIEW_SKIP_DATA_REFRESH: "1"
          VERCEL_CANONICAL_URL: ${{ vars.VERCEL_CANONICAL_URL }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_PROJECT_SLUG: ${{ vars.VERCEL_PROJECT_SLUG }}
          VERCEL_SCOPE_SLUG: ${{ vars.VERCEL_SCOPE_SLUG }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npm run deploy:live:fresh-data
